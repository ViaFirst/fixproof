<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixproof</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <header>
    <h1>Fix<i>proof</i> <span id="version" class="ver"></span></h1>
    <p data-i18n="optIntro"></p>
  </header>

  <section id="shortcut-section">
    <h2 data-i18n="optShortcut"></h2>
    <div class="row">
      <kbd id="shortcut"></kbd>
      <span id="shortcut-none" class="warn-text" data-i18n="optShortcutNone" hidden></span>
      <button type="button" id="shortcut-change" data-i18n="optShortcutChange"></button>
    </div>
    <p class="help" data-i18n="optShortcutHelp"></p>
  </section>

  <section>
    <div class="head"><h2 data-i18n="optProjects"></h2><button type="button" id="add" data-i18n="optAdd"></button></div>
    <p class="help" data-i18n="optProjectsHelp"></p>
    <div id="projects"></div>
  </section>

  <section id="outbox-section">
    <h2 data-i18n="optOutbox"></h2>
    <p class="help" data-i18n="optOutboxHelp"></p>
    <ul id="outbox" class="queue"></ul>
    <div id="sent-wrap" hidden>
      <h3 data-i18n="optSentRecent"></h3>
      <ul id="sent" class="queue sent"></ul>
    </div>
  </section>

  <section>
    <h2 data-i18n="optGeneral"></h2>
    <label><span data-i18n="optReporter"></span><input type="text" id="reporter" placeholder="Dana"></label>
    <label><span data-i18n="optToken"></span><input type="password" id="token" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
    <p class="help" data-i18n-html="optTokenHelp"></p>
  </section>

  <footer>
    <span id="footer-ver"></span> ·
    <a href="https://github.com/ViaFirst/fixproof" target="_blank" rel="noopener" data-i18n="optSource"></a> ·
    <a href="https://github.com/ViaFirst/fixproof/blob/main/PRIVACY.md" target="_blank" rel="noopener" data-i18n="optPrivacy"></a>
  </footer>

  <div class="bar">
    <span id="dirty" class="dirty" data-i18n="optUnsaved" hidden></span>
    <button type="button" id="save" class="primary" data-i18n="optSave"></button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
</main>

<template id="tpl">
  <details class="project">
    <summary>
      <span class="p-name" dir="auto"></span>
      <span class="p-where"></span>
      <span class="p-mark"></span>
    </summary>
    <div class="p-body">
      <div class="grid">
        <label><span data-i18n="optName"></span><input type="text" data-k="name" placeholder="example.com"></label>
        <label><span data-i18n="optBackend"></span><select data-k="backend"><option value="github">GitHub Issues</option><option value="mesila">Mesila</option></select></label>
      </div>
      <div data-for="github">
        <label><span data-i18n="optRepo"></span><input type="text" data-k="repo" placeholder="owner/tasks-repo" spellcheck="false"></label>
      </div>
      <div data-for="mesila" hidden>
        <div class="grid">
          <label><span data-i18n="optMesilaUrl"></span><input type="url" data-k="url" placeholder="https://mesila.example.com" spellcheck="false"></label>
          <label><span data-i18n="optBoard"></span><input type="text" data-k="board" placeholder="MSL" spellcheck="false" autocapitalize="characters"></label>
        </div>
        <label><span data-i18n="optMesilaToken"></span><input type="password" data-k="token" autocomplete="off" spellcheck="false" placeholder="msl_…"></label>
        <p class="help" data-i18n="optMesilaTokenHelp"></p>
        <p class="help from" hidden></p>
      </div>
      <label><span data-i18n="optOrigins"></span><textarea data-k="origins" rows="3" spellcheck="false" placeholder="https://example.com&#10;https://staging.example.com&#10;http://example.local"></textarea></label>
      <div class="row">
        <button type="button" data-act="test" data-i18n="optTest"></button>
        <button type="button" data-act="perm" data-i18n="optPerm"></button>
        <span class="out" role="status"></span>
        <button type="button" data-act="del" class="del" data-i18n="optDelete"></button>
      </div>
    </div>
  </details>
</template>
<script src="options.js" type="module"></script>
</body>
</html>
